<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiTS - recorded BlocksWorld trajectories</title>
<style>
:root{font-family:Arial,system-ui,sans-serif;color:#15324b;background:#f3f6fa;color-scheme:light;--teal:#087e8b;--line:#d9e2ec;--muted:#5c6d80;--red:#b33e46;--green:#25734e}
*{box-sizing:border-box}body{margin:0}main{max-width:1160px;margin:auto;padding:25px 30px 22px}h1{font-size:28px;letter-spacing:-.5px;margin:0 0 7px}p{margin:0}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.3px;color:var(--teal);margin-bottom:8px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.provenance{font-size:14px;color:var(--muted)}.offline{font-size:14px;white-space:nowrap;background:#e2f0ee;padding:10px 14px;border-radius:8px;color:#185947}.choice{display:flex;align-items:center;gap:12px;margin:22px 0 9px}label{font-size:15px;font-weight:700}select,button{font:inherit;font-size:16px;border:1px solid #bdcbd8;border-radius:7px;background:white;padding:9px 13px;color:inherit}select{flex:1;min-width:0}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #75bfc8;outline-offset:3px}button:disabled{opacity:.4;cursor:default}.metadata{font-size:14px;color:var(--muted);margin-bottom:17px}.stage{background:white;border:1px solid var(--line);border-radius:12px;padding:18px 22px 9px}.action-row{display:flex;justify-content:space-between;gap:16px;align-items:center}.action{font-size:21px;min-height:29px;font-weight:700}.step{font-size:15px;color:var(--muted);white-space:nowrap}.goals{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center;font-size:14px}.goal{padding:6px 10px;background:#f0f3f7;border-radius:6px}.goal.met{background:#e3f3e8;color:#165735}.goal-prefix{font-weight:700;margin-right:3px}.board{width:100%;height:270px;display:block}.board text{font-family:Arial,system-ui,sans-serif}.status{padding:11px 0 6px;min-height:42px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:15px}.pill{background:#edf1f5;color:#354b61;border-radius:6px;padding:7px 10px}.pill.valid{background:#e3f3e8;color:#165735}.pill.closed{background:#fae5e6;color:#972c35}.cycle-detail{font-size:15px;font-weight:700;color:var(--red);min-height:25px;margin-top:4px}.controls{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:15px}.buttons{display:flex;gap:9px;flex-wrap:wrap}.play{background:var(--teal);color:white;border-color:var(--teal);min-width:95px}.key-hint{font-size:13px;color:var(--muted)}.path-label{font-size:13px;color:var(--muted);margin:15px 0 0}.path{width:100%;height:94px;display:block}.footer{display:flex;justify-content:space-between;gap:20px;font-size:13px;color:var(--muted);margin-top:4px}details{margin-top:16px;font-size:13px;color:var(--muted)}summary{cursor:pointer}.sources{word-break:break-word;line-height:1.6;margin:10px 0}.sources code{font-size:12px}.comparison-note{margin-top:11px;font-size:13px;color:var(--muted)}
@media(max-width:700px){main{padding:18px 14px}.top,.action-row,.controls{align-items:flex-start;flex-direction:column;gap:9px}h1{font-size:24px}.choice{flex-direction:column;align-items:stretch}.stage{padding:15px 12px 7px}.action{font-size:18px}.footer{flex-direction:column;gap:5px}.key-hint{display:none}.offline{padding:7px 10px}.board{height:270px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main id="lits-recorded-replay">
  <div class="top">
    <div><div class="eyebrow">LiTS / BLOCKSWORLD</div><h1>Recorded planning, step by step</h1><p class="provenance">Real experiment trajectories · independent legal-action replay</p></div>
    <div class="offline">Offline replay · new API calls: 0</div>
  </div>
  <div class="choice"><label for="scenario">Recorded example</label><select id="scenario" aria-label="Recorded example"></select></div>
  <p class="metadata" id="metadata"></p>
  <section class="stage" aria-label="BlocksWorld trajectory replay">
    <div class="action-row"><div class="action" id="action" aria-live="polite"></div><div class="step" id="step"></div></div>
    <div class="goals" id="goals"></div>
    <svg id="board" class="board" role="img" aria-label="Current block positions"></svg>
    <div class="status" id="status"></div>
    <div class="cycle-detail" id="cycle-detail" aria-live="polite"></div>
  </section>
  <div class="controls"><div class="buttons"><button id="previous">← Previous</button><button id="play" class="play">Play</button><button id="next">Next →</button></div><span class="key-hint">Arrow keys also move one recorded step</span></div>
  <p class="path-label">DISPLAYED PATH · LOGGED NODE IDS</p>
  <svg id="path" class="path" role="img" aria-label="Logged path and ancestor-cycle match"></svg>
  <div class="footer"><span id="validation"></span><span>Saved trajectories · no new search is started</span></div>
  <p class="comparison-note" id="comparison-note"></p>
  <details><summary>Source evidence and hashes</summary><div id="sources" class="sources"></div></details>
</main>
<script id="replay-data" type="application/json">__REPLAY_DATA__</script>
<script>
(() => {
  'use strict';
  const data = JSON.parse(document.getElementById('replay-data').textContent);
  const el = id => document.getElementById(id);
  const ns = 'http://www.w3.org/2000/svg';
  const colors = {blue:'#b4d6fa',red:'#f5bcbc',orange:'#ffd2a3',yellow:'#f4e38d',green:'#b4dec6'};
  let example = 0, step = 0, timer = null;
  const row = () => data.examples[example];
  const state = () => row().steps[step];
  function svg(tag, attrs={}, text=null) {
    const node=document.createElementNS(ns,tag);
    Object.entries(attrs).forEach(([name,value])=>node.setAttribute(name,String(value)));
    if(text!==null)node.textContent=text;
    return node;
  }
  function add(parent,tag,attrs,text) {const node=svg(tag,attrs,text);parent.appendChild(node);return node;}
  function upper(value) {return value.charAt(0).toUpperCase()+value.slice(1);}
  function stop() {if(timer!==null)clearInterval(timer);timer=null;el('play').textContent='Play';}
  function block(parent,name,x,y,width,height) {
    const g=add(parent,'g',{'data-block':name,'data-support':state().positions[name]});
    add(g,'title',{},`${upper(name)} on ${state().positions[name]}`);
    add(g,'rect',{x:x-width/2,y,width,height,rx:7,fill:colors[name]||'#d5dee7',stroke:'#4d6278','stroke-width':1.3});
    add(g,'text',{x,y:y+height/2+6,'text-anchor':'middle',fill:'#18334b','font-size':Math.min(18,Math.max(12,width/4)),'font-weight':700},upper(name));
  }
  function drawBoard() {
    const board=el('board'),w=Math.max(280,board.getBoundingClientRect().width),h=270;
    board.setAttribute('viewBox',`0 0 ${w} ${h}`);board.replaceChildren();
    const pos=state().positions, roots=Object.keys(pos).filter(b=>pos[b]==='table').sort();
    const tableY=236,bh=30,gap=3,bw=Math.min(130,(w-44)/Math.max(roots.length,2)-15);
    add(board,'line',{x1:16,y1:tableY,x2:w-16,y2:tableY,stroke:'#8798ab','stroke-width':2});
    add(board,'text',{x:24,y:tableY+25,fill:'#63748a','font-size':13,'letter-spacing':2},'TABLE');
    add(board,'text',{x:w/2,y:26,'text-anchor':'middle',fill:'#63748a','font-size':13,'letter-spacing':1.5},'HAND');
    add(board,'rect',{x:w/2-bw/2-10,y:37,width:bw+20,height:58,rx:9,fill:'#f7f9fb',stroke:'#becbd8','stroke-width':1});
    const held=Object.keys(pos).find(b=>pos[b]==='hand');
    if(held)block(board,held,w/2,51,bw,bh);
    else add(board,'text',{x:w/2,y:72,'text-anchor':'middle',fill:'#718197','font-size':15},'empty');
    roots.forEach((root,i)=>{
      const x=25+(w-50)*(i+.5)/roots.length;let name=root,level=0;
      while(name){block(board,name,x,tableY-bh-(bh+gap)*level,bw,bh);name=Object.keys(pos).find(b=>pos[b]===name);level++;}
    });
    board.setAttribute('aria-label',Object.entries(pos).map(([b,s])=>`${b} on ${s}`).join('; '));
  }
  function drawPath() {
    const path=el('path'),w=Math.max(280,path.getBoundingClientRect().width),n=row().steps.length,y=48;
    path.setAttribute('viewBox',`0 0 ${w} 94`);path.replaceChildren();
    const x=i=>30+(w-60)*i/(n-1);
    for(let i=1;i<n;i++)add(path,'line',{x1:x(i-1),y1:y,x2:x(i),y2:y,stroke:i<=step?'#087e8b':'#d5dee7','stroke-width':2});
    row().steps.forEach((s,i)=>{
      const current=i===step,match=state().closed_as_cycle&&i===state().cycle_ancestor_step;
      const fill=current?(s.closed_as_cycle?'#b33e46':s.goal_satisfied?'#25734e':'#087e8b'):'#edf2f7';
      add(path,'circle',{cx:x(i),cy:y,r:17,fill,stroke:match?'#b33e46':'none','stroke-width':3});
      add(path,'text',{x:x(i),y:y+5,'text-anchor':'middle',fill:current?'white':'#354b61','font-size':14,'font-weight':700},s.node_id);
      add(path,'text',{x:x(i),y:83,'text-anchor':'middle',fill:'#64758b','font-size':12},`step ${i}`);
    });
    if(state().closed_as_cycle){
      const defs=add(path,'defs');const marker=add(defs,'marker',{id:'cycle-arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});
      add(marker,'path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#b33e46'});
      const a=x(step),b=x(state().cycle_ancestor_step);
      add(path,'path',{d:`M ${a} 29 C ${a} 3 ${b} 3 ${b} 29`,fill:'none',stroke:'#b33e46','stroke-width':2,'marker-end':'url(#cycle-arrow)'});
    }
  }
  function render() {
    const e=row(),s=state();
    el('metadata').textContent=`Round ${e.round} · ${e.task_id} · ${e.arm} · recorded task ${e.run_success?'succeeded':'failed'} · ${e.run_calls} historical API calls (whole task)`;
    el('action').textContent=s.action?upper(s.action):'Initial state';
    el('step').textContent=`Step ${step} / ${e.steps.length-1} · node ${s.node_id}`;
    el('goals').replaceChildren();
    const prefix=document.createElement('span');prefix.className='goal-prefix';prefix.textContent='Goal';el('goals').appendChild(prefix);
    let matched=0;
    e.goal_relations.forEach(([b,support])=>{
      const ok=s.positions[b]===support;matched+=Number(ok);
      const item=document.createElement('span');item.className='goal'+(ok?' met':'');item.textContent=`${ok?'✓':'○'} ${upper(b)} on ${upper(support)}`;el('goals').appendChild(item);
    });
    const status=el('status');status.replaceChildren();
    const tags=[[s.goal_satisfied?'Goal reached':`${matched} / ${e.goal_relations.length} goal relations met`,s.goal_satisfied?'valid':''],[step?'Legal action · logged state matched':'Initial state verified','valid']];
    if(s.closed_as_cycle)tags.push(['CLOSED · ancestor cycle','closed']);
    tags.forEach(([label,cls])=>{const span=document.createElement('span');span.className='pill '+cls;span.textContent=label;status.appendChild(span);});
    el('cycle-detail').textContent=s.closed_as_cycle?`Node ${s.node_id} repeats node ${s.cycle_ancestor_node_id} at step ${s.cycle_ancestor_step} · same block positions · no further children`:'';
    el('previous').disabled=step===0;el('next').disabled=step===e.steps.length-1;
    el('validation').textContent=`${e.steps.length-1} logged actions · all displayed transitions independently checked`;
    el('comparison-note').textContent=e.task_id==='instance-69'?'The control and pruned runs were sampled independently. This case illustrates a mechanism, not a causal accuracy claim.':'';
    const sources=el('sources');sources.replaceChildren();
    e.sources.forEach(item=>{const p=document.createElement('p');p.textContent=item.path;const code=document.createElement('code');code.textContent='SHA256 '+item.sha256;p.appendChild(document.createElement('br'));p.appendChild(code);sources.appendChild(p);});
    drawBoard();drawPath();
  }
  data.examples.forEach((e,i)=>{const option=document.createElement('option');option.value=i;option.textContent=e.label;el('scenario').appendChild(option);});
  el('scenario').addEventListener('change',()=>{stop();example=Number(el('scenario').value);step=0;render();});
  el('previous').addEventListener('click',()=>{stop();if(step>0)step--;render();});
  el('next').addEventListener('click',()=>{stop();if(step<row().steps.length-1)step++;render();});
  el('play').addEventListener('click',()=>{
    if(timer!==null){stop();return;}
    if(step===row().steps.length-1)step=0;
    el('play').textContent='Pause';render();
    timer=setInterval(()=>{if(step<row().steps.length-1){step++;render();}if(step===row().steps.length-1)stop();},1300);
  });
  document.addEventListener('keydown',event=>{if(['SELECT','INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(event.key==='ArrowRight'){event.preventDefault();el('next').click();}if(event.key==='ArrowLeft'){event.preventDefault();el('previous').click();}});
  new ResizeObserver(()=>{drawBoard();drawPath();}).observe(el('board'));
  render();
})();
</script>
</body>
</html>
